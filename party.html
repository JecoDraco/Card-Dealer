body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { font-size: 2rem; letter-spacing: 3px; margin: 10px 0 4px; }
.subtitle { color: #8888aa; margin-bottom: 24px; font-size: 0.9rem; }

/* Category grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  max-width: 800px;
  width: 100%;
}
.cat-card {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid rgba(255,255,255,0.06);
  user-select: none;
}
.cat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.15); }
.cat-card .emoji { font-size: 2.4rem; margin-bottom: 10px; }
.cat-card .name { font-size: 1.1rem; font-weight: 700; }
.cat-card .desc { color: #8888aa; font-size: 0.8rem; margin-top: 6px; }
.cat-card:active { transform: scale(0.97); }

/* Game screen */
.game-screen {
  display: none;
  max-width: 700px;
  width: 100%;
  flex-direction: column;
  align-items: center;
}
.game-screen.active { display: flex; }

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 24px;
}
.btn-back {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #8888aa;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-back:hover { background: rgba(255,255,255,0.15); color: #fff; }

.cat-label {
  font-size: 0.85rem;
  color: #8888aa;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.prompt-box {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 24px;
  padding: 48px 36px;
  width: 100%;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  margin-bottom: 24px;
}
.prompt-text {
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.4;
  max-width: 550px;
}
.prompt-text.fade-in {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.prompt-text.small { font-size: 1.2rem; }

.game-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn-primary {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 14px 36px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 1px;
  font-family: inherit;
}
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: #aaa;
  border: none;
  padding: 14px 24px;
  border-radius: 12px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); color: #fff; }

.count-display {
  color: #555577;
  font-size: 0.85rem;
  margin-top: 16px;
  text-align: center;
}

.footer { margin-top: 30px; color: rgba(255,255,255,0.15); font-size: 0.75rem; text-align: center; }

/* responsive */
@media (max-width: 500px) {
  .cat-grid { grid-template-columns: 1fr; }
  .prompt-box { padding: 32px 20px; min-height: 180px; }
  .prompt-text { font-size: 1.2rem; }
  .prompt-text.small { font-size: 1rem; }
  h1 { font-size: 1.5rem; }
}
</style>

// ── State ──
let currentCat = null;
let currentIndex = 0;
let history = [];

const catGrid = document.getElementById('catGrid');
const gameScreen = document.getElementById('gameScreen');
const promptText = document.getElementById('promptText');
const catLabel = document.getElementById('catLabel');
const countDisplay = document.getElementById('countDisplay');
const btnBack = document.getElementById('btnBack');
const btnNext = document.getElementById('btnNext');
const btnShuffle = document.getElementById('btnShuffle');

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 600; osc.type = 'sine';
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.06);
  } catch(_) {}
}

function renderCategories() {
  catGrid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `<div class="emoji">${cat.emoji}</div><div class="name">${cat.name}</div><div class="desc">${cat.desc}</div>`;
    card.addEventListener('click', () => openCategory(cat.id));
    catGrid.appendChild(card);
  });
}

function openCategory(id) {
  const cat = CATEGORIES.find(c => c.id === id);
  if (!cat) return;
  currentCat = cat;
  currentIndex = 0;
  history = shuffleArray([...cat.prompts]);
  gameScreen.classList.add('active');
  catGrid.style.display = 'none';
  document.getElementById('subtitle').style.display = 'none';
  catLabel.textContent = cat.emoji + ' ' + cat.name;
  showPrompt();
  playSound();
}

function showPrompt() {
  const prompt = history[currentIndex];
  promptText.textContent = prompt;
  promptText.className = 'prompt-text';
  if (prompt.length > 80) promptText.classList.add('small');
  // trigger reflow for animation
  void promptText.offsetWidth;
  promptText.classList.add('fade-in');
  countDisplay.textContent = `${currentIndex + 1} / ${history.length}`;
}

function nextPrompt() {
  if (!currentCat) return;
  currentIndex = (currentIndex + 1) % history.length;
  showPrompt();
  playSound();
}

function reshuffle() {
  if (!currentCat) return;
  history = shuffleArray([...currentCat.prompts]);
  currentIndex = 0;
  showPrompt();
  playSound();
}

function goBack() {
  gameScreen.classList.remove('active');
  catGrid.style.display = '';
  document.getElementById('subtitle').style.display = '';
  currentCat = null;
}

btnNext.addEventListener('click', nextPrompt);
btnShuffle.addEventListener('click', reshuffle);
btnBack.addEventListener('click', goBack);

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    if (gameScreen.classList.contains('active')) nextPrompt();
  }
  if (e.code === 'Escape' && gameScreen.classList.contains('active')) goBack();
});

renderCategories();
