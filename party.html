*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {

  align-items: center;
  padding: 20px;

h1 { font-size: 2rem; letter-spacing: 3px; margin: 10px 0 4px; }
.subtitle { color: #8888aa; margin-bottom: 16px; font-size: 0.9rem; }

.top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  padding: 4px;
  border-radius: 30px;
}
.toggle-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: none;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  background: transparent;
  color: #8888aa;
}
.toggle-btn.active {
  background: #e94560;
  color: #fff;
}
.toggle-btn#btnAdult.active { background: #ff6f00; }

.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  max-width: 800px;
  width: 100%;
}
.cat-card {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid rgba(255,255,255,0.06);
  user-select: none;
}
.cat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.15); }
.cat-card .emoji { font-size: 2.4rem; margin-bottom: 10px; }
.cat-card .name { font-size: 1.1rem; font-weight: 700; }
.cat-card .desc { color: #8888aa; font-size: 0.8rem; margin-top: 6px; }
.cat-card:active { transform: scale(0.97); }

.game-screen {
  display: none;
  max-width: 700px;
  width: 100%;
  flex-direction: column;
  align-items: center;
}
.game-screen.active { display: flex; }

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 24px;
}
.btn-back {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #8888aa;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-back:hover { background: rgba(255,255,255,0.15); color: #fff; }
.cat-label { font-size: 0.85rem; color: #8888aa; letter-spacing: 2px; text-transform: uppercase; }

.prompt-box {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 24px;
  padding: 48px 36px;
  width: 100%;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  margin-bottom: 24px;
}
.prompt-text {
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.4;
  max-width: 550px;
}
.prompt-text.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.prompt-text.small { font-size: 1.2rem; }
.prompt-text.adult { color: #ffab00; }
.mode-badge {

.mode-badge.normal { background: rgba(255,255,255,0.1); color: #8888aa; }
.mode-badge.adult { background: rgba(255,111,0,0.2); color: #ffab00; }

.game-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-primary {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 14px 36px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 1px;
  font-family: inherit;
}
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
.btn-primary:active { transform: translateY(0); }
.btn-primary.adult-mode { background: #ff6f00; }

.btn-secondary {

  cursor: pointer;

  font-family: inherit;

.btn-choice {

.btn-choice-dare { background: linear-gradient(135deg, #ff6f00, #e65100); color: #fff; }

.choice-hint { color: #8888aa; font-size: 0.85rem; margin-top: 8px; }

.count-display { color: #555577; font-size: 0.85rem; margin-top: 16px; text-align: center; }
.footer { margin-top: 30px; color: rgba(255,255,255,0.15); font-size: 0.75rem; text-align: center; }
.footer a { color: #555577; text-decoration: none; }

@media (max-width: 500px) {

  .prompt-box { padding: 32px 20px; min-height: 180px; }
  .prompt-text { font-size: 1.2rem; }

  h1 { font-size: 1.5rem; }

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 600; osc.type = 'sine';
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.06);
  } catch(_) {}
}

  currentCat = null;
}

  if (cat.hasChoice) {
    const t = adultMode && cat.truthPromptsAdult ? cat.truthPromptsAdult : cat.truthPrompts;
    const d = adultMode && cat.darePromptsAdult ? cat.darePromptsAdult : cat.darePrompts;
    return { truth: t, dare: d };
  }
  const src = adultMode && cat.promptsAdult ? cat.promptsAdult : cat.prompts;
  return src;
}

  promptBox.innerHTML = `

  `;

  gameControls.style.display = 'none';
  countDisplay.textContent = '';
}

function pickChoice(choice) {
  currentChoice = choice;
  const active = getActivePrompts(currentCat);
  const pool = choice === 'truth' ? active.truth : active.dare;
  history = shuffleArray([...pool]);
  currentIndex = 0;
  showPrompt();
  playSound();
}

function openCategory(id) {
  const cat = CATEGORIES.find(c => c.id === id);
  if (!cat) return;
  currentCat = cat;
  currentChoice = null;
  currentIndex = 0;
  history = [];
  gameScreen.classList.add('active');
  catGrid.style.display = 'none';
  document.getElementById('subtitle').style.display = 'none';
  catLabel.textContent = cat.emoji + ' ' + cat.name;

  if (cat.hasChoice) {
    renderChoiceButtons();
    promptText.style.display = 'none';
  } else {
    const active = getActivePrompts(cat);
    history = shuffleArray([...active]);
    gameControls.style.display = '';
    promptText.style.display = '';
    promptBox.innerHTML = `<div class="prompt-text" id="promptText">Cargando...</div>`;
    showPrompt();
    playSound();
  }
}

function showPrompt() {
  if (!history.length) return;
  const prompt = history[currentIndex];
  const label = currentChoice === 'truth' ? '💌 Verdad' : currentChoice === 'dare' ? '⚡ Reto' : '';
  const prefix = label ? `<div style="font-size:0.75rem;color:#8888aa;letter-spacing:2px;margin-bottom:8px;">${label}</div>` : '';
  promptBox.innerHTML = `<div class="prompt-text${adultMode ? ' adult' : ''}${history[currentIndex].length > 80 ? ' small' : ''}" id="promptText">${prefix}${prompt}</div>`;
  gameControls.style.display = '';
  const switchBtn = document.getElementById('btnSwitch') || document.createElement('button');
  if (!document.getElementById('btnSwitch')) {
    switchBtn.id = 'btnSwitch';
    switchBtn.className = 'btn-switch';
    switchBtn.textContent = '↩ Otra opción';

      if (currentCat && currentCat.hasChoice) renderChoiceButtons();
    });
    gameControls.appendChild(switchBtn);
  }
  switchBtn.style.display = currentCat && currentCat.hasChoice ? '' : 'none';
  document.getElementById('btnNext').style.display = '';
  document.getElementById('btnShuffle').style.display = '';
  countDisplay.textContent = `${currentIndex + 1} / ${history.length}`;
}

function nextPrompt() {
  if (!currentCat || !history.length) return;
  currentIndex = (currentIndex + 1) % history.length;
  showPrompt();
  playSound();
}

function reshuffle() {
  if (!currentCat) return;
  if (currentCat.hasChoice && currentChoice) {
    const active = getActivePrompts(currentCat);
    const pool = currentChoice === 'truth' ? active.truth : active.dare;
    history = shuffleArray([...pool]);
  } else if (!currentCat.hasChoice) {
    const active = getActivePrompts(currentCat);
    history = shuffleArray([...active]);
  } else {
    return;
  }
  currentIndex = 0;
  showPrompt();
  playSound();
}

function goBack() {
  gameScreen.classList.remove('active');
  catGrid.style.display = '';
  document.getElementById('subtitle').style.display = '';
  currentCat = null;
  currentChoice = null;
  promptText.style.display = '';
  gameControls.style.display = '';
  document.querySelectorAll('.btn-switch').forEach(el => el.remove());
}

btnNext.addEventListener('click', nextPrompt);
btnShuffle.addEventListener('click', reshuffle);
btnBack.addEventListener('click', goBack);

    e.preventDefault();
    if (gameScreen.classList.contains('active')) nextPrompt();

});
